<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Specialty Provider Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=Nunito:wght@300;400;500;600;700&family=Lato:wght@300;400;700&family=Source+Sans+3:wght@300;400;500;600;700&family=Roboto+Flex:wght@300;400;500;600;700&family=Source+Serif+4:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=block" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6f8; --card:#fff; --ink:#1c2430; --muted:#5d6b7a; --line:#e1e6eb;
    --brand:#1f6f78; --brand-ink:#fff; --brand-soft:#e3f1f2;
    --ok:#1e7a46; --ok-soft:#e5f4ea; --no:#a8322d; --no-soft:#fbe9e8;
    --warn:#8a5a00; --warn-soft:#fff4dc; --radius:12px;
    --field:#fff; --hover-line:#c6ced6; --cp-hover:#eef3f5; --faint:#8a96a3;
    --tip-bg:#1c2430; --tip-ink:#fff; --on-brand:#fff; --header:#1f6f78; --danger-line:#efc9c6;
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --bg:#121212; --card:#1c1c1c; --ink:#e8e8e8; --muted:#a3a3a3; --line:#2f2f2f;
    --brand:#4fb3bd; --brand-ink:#fff; --brand-soft:#1d3b40;
    --ok:#6fd39a; --ok-soft:#173527; --no:#f08a83; --no-soft:#3d1f1d;
    --warn:#f2c46b; --warn-soft:#3a2e14;
    --field:#171717; --hover-line:#474747; --cp-hover:#2a2a2a; --faint:#858585;
    --tip-bg:#e8e8e8; --tip-ink:#121212; --on-brand:#0d1a1c; --header:#1c1c1c; --danger-line:#5a2e2b;
    color-scheme:dark;
  }
  /* ---- Sage theme ---- */
  :root[data-palette="sage"]{
    --bg:#f2f0e8; --card:#fbfaf5; --ink:#2e382b; --muted:#687262; --line:#dcd8ca;
    --brand:#5b7752; --brand-ink:#fff; --brand-soft:#e5eadb;
    --ok:#4d7a38; --ok-soft:#e2ebd4; --no:#a4533a; --no-soft:#f4e2d9;
    --warn:#966914; --warn-soft:#f5ebcf;
    --field:#fffefa; --hover-line:#c7c2af; --cp-hover:#ebe8dc; --faint:#929888;
    --tip-bg:#2e382b; --tip-ink:#fff; --header:#55704c; --danger-line:#e6c3b5; --on-brand:#fff; --trim-limited:#b98a2e;
  }
  :root[data-palette="sage"][data-theme="dark"]{
    --bg:#151713; --card:#1e211b; --ink:#e5e8de; --muted:#a3aa99; --line:#323728;
    --brand:#9ab58b; --brand-ink:#fff; --brand-soft:#28321f;
    --ok:#9cc488; --ok-soft:#23311b; --no:#df9278; --no-soft:#3a221a;
    --warn:#dfb766; --warn-soft:#352a13;
    --field:#191b16; --hover-line:#4a5040; --cp-hover:#292d23; --faint:#868c7d;
    --tip-bg:#e5e8de; --tip-ink:#151713; --header:#1e211b; --danger-line:#5a3226; --on-brand:#12170e; --trim-limited:#c9a24e;
  }
  /* ---- Mocha theme (warm neutral / brown) ---- */
  :root[data-palette="mocha"]{
    --bg:#e9e1d4; --card:#fdfbf7; --ink:#3a2f27; --muted:#76675b; --line:#dcd1c1;
    --brand:#86603f; --brand-ink:#fff; --brand-soft:#f0e5d8;
    --ok:#5c7838; --ok-soft:#e7ebd5; --no:#a8493a; --no-soft:#f5e0da;
    --warn:#966714; --warn-soft:#f6eacf;
    --field:#fffdf9; --hover-line:#cfc2b2; --cp-hover:#f0e9df; --faint:#a19282;
    --tip-bg:#3a2f27; --tip-ink:#fff; --header:#7a5a40; --danger-line:#ebc5bc; --on-brand:#fff; --trim-limited:#c08f35;
  }
  /* softer dark: lifted warm charcoal, off-white text */
  :root[data-palette="mocha"][data-theme="dark"]{
    --bg:#2a2420; --card:#332c27; --ink:#e9e0d5; --muted:#b2a494; --line:#473e37;
    --brand:#cfa57d; --brand-ink:#fff; --brand-soft:#44382e;
    --ok:#a8c288; --ok-soft:#363b2a; --no:#e09e8d; --no-soft:#4a302a;
    --warn:#e0bb76; --warn-soft:#473a25;
    --field:#2e2823; --hover-line:#5b5047; --cp-hover:#3d352f; --faint:#988b7d;
    --tip-bg:#e9e0d5; --tip-ink:#2a2420; --header:#332c27; --danger-line:#6a3f36; --on-brand:#2a2018; --trim-limited:#cfa75c;
  }
  /* ---- Minimal theme (business) ---- */
  :root[data-palette="minimal"]{
    --bg:#f6f7f8; --card:#fff; --ink:#111418; --muted:#5d646e; --line:#e3e5e9;
    --brand:#2b3a4f; --brand-ink:#111418; --brand-soft:#eef0f3;
    --ok:#2f6b45; --ok-soft:#edf3ef; --no:#9b3a32; --no-soft:#f6ecea;
    --warn:#87631a; --warn-soft:#f6f0e2;
    --field:#fff; --hover-line:#c6cad1; --cp-hover:#f0f1f3; --faint:#8a9099;
    --tip-bg:#111418; --tip-ink:#fff; --header:#fff; --danger-line:#e5cdca; --on-brand:#fff; --trim-limited:#b08a3a;
  }
  :root[data-palette="minimal"][data-theme="dark"]{
    --bg:#141517; --card:#1b1c1f; --ink:#e8e9eb; --muted:#9da1a8; --line:#2c2e33;
    --brand:#c3cad4; --brand-ink:#e8e9eb; --brand-soft:#25272b;
    --ok:#7fb592; --ok-soft:#1f2a23; --no:#dc8a82; --no-soft:#2e2120;
    --warn:#d7b46a; --warn-soft:#2c271b;
    --field:#17181b; --hover-line:#45484f; --cp-hover:#232528; --faint:#7c8088;
    --tip-bg:#e8e9eb; --tip-ink:#141517; --header:#1b1c1f; --danger-line:#4a2c29; --on-brand:#141517; --trim-limited:#c9a35a;
  }
  body{transition:background-color .2s,color .2s}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font, Inter, system-ui, sans-serif);font-weight:var(--wbase, 400);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
  header{background:var(--header);border-bottom:1px solid var(--line);color:var(--brand-ink);padding:11px 24px}
  header h1{margin:0;font-size:18px;line-height:1.25;font-weight:700;letter-spacing:-.01em}
  header p{margin:1px 0 0;opacity:.8;font-size:12.5px}
  header .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .theme-btn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;padding:4px 10px;font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .settings-wrap{position:relative}
  .theme-btn.gear{padding:4px 7px}
  .settings{position:absolute;right:0;top:calc(100% + 6px);z-index:40;width:270px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.22);padding:10px;text-align:left}
  .set-h{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:2px 4px 6px}
  .set-h + .font-list{margin-bottom:10px}
  .pal-list{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:10px}
  .pal-opt{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:13px;text-align:left}
  .pal-opt.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
  .pal-opt .sw{display:inline-flex;border-radius:5px;overflow:hidden;border:1px solid rgba(0,0,0,.12);flex:0 0 auto}
  .pal-opt .sw i{width:9px;height:18px;display:block}
  .font-list{display:flex;flex-direction:column;gap:3px}
  .font-opt{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:6px 9px;border-color:transparent;background:transparent;text-align:left;font-size:14px;line-height:1.3}
  .font-opt .sample{font-size:12px;color:var(--muted)}
  .font-opt:hover{background:var(--cp-hover);border-color:transparent}
  .font-opt.on{border-color:var(--brand);background:var(--brand-soft)}
  .size-seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
  .size-seg button{padding:5px 2px;font-size:12px}
  .size-seg.w3{grid-template-columns:repeat(3,1fr);margin-bottom:10px}
  .size-seg.w3 button.on{font-weight:inherit}
  .size-seg button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
  .size-seg.w3 button.on{font-weight:revert-layer}
  .hdr-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .theme-btn:hover{background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.4)}
  .theme-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .wrap{max-width:1260px;margin:0 auto}
  .toolbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 24px;border-bottom:1px solid var(--line)}
  .toolbar .wrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .toolbar input,.toolbar select{padding:5px 10px;font-size:13.5px;border-radius:7px}
  .toolbar button{padding:5px 12px;font-size:13.5px;border-radius:7px}
  input,select,textarea{font:inherit;color:inherit;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--field);width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
  .toolbar .search{flex:1 1 220px}
  .toolbar select{flex:0 1 165px;width:auto;min-width:0}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--field);padding:9px 14px;color:var(--ink)}
  button:hover{border-color:var(--hover-line)}
  button.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:600}
  button.primary:hover{filter:brightness(1.07)}
  button.danger{color:var(--no);border-color:var(--danger-line)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .count{color:var(--muted);font-size:13px;padding:10px 0 0}
  .banner{margin:14px 0 0;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:14px;display:none}
  main{padding:8px 0 40px}
  .content{max-width:1308px;padding:0 24px}
  .grid{display:flex;flex-direction:column;gap:8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px;display:grid;grid-template-columns:210px 235px minmax(0,1fr) auto;gap:6px 18px;align-items:start}
  .c-id{min-width:0}
  .c-id .updated{margin-top:5px}
  .c-ins{display:flex;flex-direction:column;gap:6px;min-width:0}
  .c-act{justify-self:end}
  .card .notes{grid-column:1/-1}
  @media (max-width:820px){
    .card{grid-template-columns:1fr auto;gap:8px 12px}
    .c-id{grid-column:1}.c-act{grid-column:2;grid-row:1}
    .c-contact,.c-ins{grid-column:1/-1}
  }
  
  .card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .name{font-size:15.5px;font-weight:700;margin:0;line-height:1.25}
  .spec{display:inline-block;margin-top:3px;background:var(--brand-soft);color:var(--brand);font-weight:600;font-size:11.5px;padding:1px 8px;border-radius:999px}
  .tags{display:flex;flex-direction:column;gap:4px;margin-top:4px;align-items:flex-start}
  .tags .spec{margin-top:0}
  .status{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px}
  .status i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
  .s-open{color:var(--ok)} .status.s-open{background:var(--ok-soft)}
  .s-limited{color:var(--warn)} .status.s-limited{background:var(--warn-soft)}
  .s-closed{color:var(--no)} .status.s-closed{background:var(--no-soft)}
  .sect{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--brand);margin-bottom:-4px}
  .loc-edit{border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;margin-bottom:10px;background:var(--bg)}
  .loc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .loc-head .sect{margin:0}
  .rm-loc{padding:3px 9px;font-size:12px;color:var(--no);border-color:var(--danger-line)}
  .add-loc{width:100%;border-style:dashed;color:var(--brand);font-weight:600;font-size:13.5px;padding:8px}
  .more-locs{margin-top:-1px}
  .loc-toggle{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 7px;font-size:12.5px;font-weight:600;color:var(--brand);background:var(--brand-soft);border-color:transparent;border-radius:999px}
  .loc-toggle:hover{border-color:var(--brand)}
  .loc-toggle svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
  .loc-toggle[aria-expanded="true"] svg{transform:rotate(90deg)}
  .loc-list{display:flex;flex-direction:column;gap:8px;margin-top:8px;padding-left:12px;border-left:2px solid var(--line)}
  .loc{display:flex;flex-direction:column;gap:3px}
  .loc-name{font-size:12.5px;font-weight:600}
  .tagbox{display:flex;flex-wrap:wrap;align-items:center;gap:5px;border:1px solid var(--line);border-radius:8px;padding:5px 6px;background:var(--field);cursor:text}
  .tagbox:focus-within{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
  #specTags{display:contents}
  .tagbox input{border:none;outline:none !important;padding:3px 4px;flex:1 1 140px;width:auto;min-width:120px;background:transparent}
  .tag{display:inline-flex;align-items:center;gap:3px;background:var(--brand-soft);color:var(--brand);font-weight:600;font-size:13px;padding:2px 4px 2px 9px;border-radius:999px}
  .tag button{border:none;background:none;color:inherit;padding:0 4px;font-size:15px;line-height:1;border-radius:999px;cursor:pointer}
  .tag button:hover{background:rgba(0,0,0,.08)}
  .specs{display:flex;flex-wrap:wrap;gap:4px}
  .seg{display:flex;flex-wrap:wrap;gap:6px}
  .seg label{margin:0;font-weight:500;cursor:pointer}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg span{display:inline-block;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--field);color:var(--muted);font-size:13.5px}
  .seg input:checked + span{border-color:currentColor;font-weight:600;box-shadow:inset 0 0 0 1px currentColor}
  .seg input:checked + span:not([class]){color:var(--ink)}
  .seg input:checked + span.s-open{color:var(--ok);background:var(--ok-soft)}
  .seg input:checked + span.s-limited{color:var(--warn);background:var(--warn-soft)}
  .seg input:checked + span.s-closed{color:var(--no);background:var(--no-soft)}
  .seg input:focus-visible + span{outline:2px solid var(--brand);outline-offset:2px}
  .edit-btn{padding:2px 8px;font-size:12px;color:var(--muted)}
  .icon-btn,.blurb-btn{display:inline-flex;align-items:center;padding:3px 6px}
  .blurb-btn{margin-left:-4px}
  .icon-btn svg,.blurb-btn svg{width:14px;height:14px;fill:none;stroke:var(--brand);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  dl{margin:0;display:grid;grid-template-columns:24px 1fr;gap:2px 6px;font-size:13.5px;line-height:1.35}
  dt{color:var(--muted);font-weight:500;font-size:11px;letter-spacing:.03em;display:flex;align-items:center;height:18px}
  dt.ic svg{width:15px;height:15px;fill:none;stroke:var(--brand);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  dd{margin:0;display:flex;align-items:center;gap:4px;flex-wrap:wrap;word-break:break-word}
  .cp{cursor:pointer;border-radius:3px}
  .cp:hover{background:var(--cp-hover)}
  .bubble{position:absolute;z-index:40;background:var(--tip-bg);color:var(--tip-ink);font-size:12px;font-weight:500;padding:3px 8px;border-radius:6px;pointer-events:none;opacity:0;transform:translateY(3px);transition:opacity .15s,transform .15s}
  .bubble::after{content:"";position:absolute;left:50%;bottom:-4px;margin-left:-4px;border:4px solid transparent;border-bottom:0;border-top-color:var(--tip-bg)}
  .bubble.show{opacity:1;transform:none}
  .copy{border:none;background:none;padding:0 5px;font-size:11.5px;color:var(--brand);border-radius:6px}
  .copy:hover{background:var(--brand-soft)}
  .ins h4{margin:0 0 3px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:3px}
  .chip{font-size:12px;padding:1px 7px;line-height:1.5;border-radius:999px;font-weight:500}
  .chip.ok{background:var(--ok-soft);color:var(--ok)}
  .chip.no{background:var(--no-soft);color:var(--no)}
  .chip.hit{outline:2px solid currentColor}
  .none{color:var(--muted);font-size:12.5px;font-style:italic}
  .notes{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;line-height:1.35;white-space:pre-wrap}
  .updated{font-size:11px;color:var(--faint)}
  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty h2{color:var(--ink);font-size:18px;margin:0 0 6px}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(20,28,38,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:20}
  .overlay.open{display:flex}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:14px;width:100%;max-width:620px;padding:22px 24px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
  .modal h2{margin:0 0 16px;font-size:19px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
  .form-grid .full{grid-column:1/-1}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
  .hint{font-weight:400;color:var(--muted)}
  .field-msg{font-size:12px;margin-top:4px;color:var(--warn)}
  .modal-actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
  .modal-actions .right{display:flex;gap:10px;margin-left:auto}
  .confirm{display:none;background:var(--no-soft);color:var(--no);border-radius:8px;padding:10px 12px;margin-top:14px;font-size:14px;align-items:center;justify-content:space-between;gap:10px}
  .confirm.show{display:flex}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--tip-bg);color:var(--tip-ink);padding:9px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
  .toast.show{opacity:1}
  @media (max-width:560px){.form-grid{grid-template-columns:1fr}.toolbar select{flex:1 1 45%}}
  /* ---- alt card layout ---- */
  .grid{display:flex;flex-direction:column;gap:8px}
  .card{display:flex !important;flex-direction:column;align-items:stretch !important;gap:7px;padding:11px 15px !important;border-left:3px solid var(--brand) !important}
  .r1{display:flex;align-items:flex-start;gap:12px;flex-wrap:nowrap}
  .r1 .name{flex:1 1 auto;min-width:0;overflow-wrap:anywhere;padding-top:2px}
  .r1 .name{font-size:15.5px;margin-right:2px}
  .rtags{display:flex;flex-direction:column;gap:4px;align-items:flex-start;margin-top:-3px}
  .rtags .spec{margin:0}
  .contact{display:flex;flex-direction:column;gap:3px}
  .r1-end{margin-left:auto;flex:0 0 auto;display:flex;align-items:center;gap:10px;white-space:nowrap}
  .r2{display:flex;flex-wrap:wrap;gap:4px 0;font-size:13.5px;align-items:center}
  .r2 .it{display:inline-flex;align-items:center;gap:6px;padding-right:14px;margin-right:14px;border-right:1px solid var(--line)}
  .r2 .it:last-child{border-right:none;margin-right:0;padding-right:0}
  .ico svg{width:14px;height:14px;fill:none;stroke:var(--brand);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
  .npi-l{width:14px;text-align:center;font-size:9.5px;font-weight:600;color:var(--muted);letter-spacing:.04em}
  .r3{display:flex;flex-wrap:wrap;gap:6px 8px;padding-top:7px;border-top:1px solid var(--line)}
  .ins-pop{position:relative}
  .ins-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 6px 3px 8px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--field)}
  .ins-pill svg{width:14px;height:14px;fill:none;stroke:var(--brand);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

</div></header>

<div class="toolbar"><div class="wrap">

      <div class="full"><label for="name">Provider name *</label><input id="name" required placeholder="e.g. Jane Smith, MD or Valley Cardiology Group"></div>

          <label><input type="radio" name="status" value="limited"><span class="s-limited">Limited</span></label>

      <div class="full"><label for="accepted">Insurances accepted <span class="hint">(separate with commas)</span></label><input id="accepted" placeholder="e.g. Medicaid, Medicare, IHS/PRC, Blue Cross"></div>
      <div class="full"><label for="notAccepted">Insurances NOT accepted <span class="hint">(separate with commas)</span></label><input id="notAccepted" placeholder="e.g. Tricare, Kaiser"></div>

      <button type="button" class="danger" id="delBtn" hidden>Delete</button>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let providers = [];           // [{id, ...data}]
  let col = null;               // db collection
  let canWrite = true;
  let editingId = null;
  let loaded = false;

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const splitList = s => String(s || "").split(/[,;\n]/).map(x => x.trim()).filter(Boolean);
  const norm = s => String(s || "").toLowerCase();
  const digits = s => String(s || "").replace(/\D/g, "");

  function fmtPhone(p){
    const d = digits(p);
    if (d.length === 10) return `${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}`;
    if (d.length === 11 && d[0] === "1") return `${d.slice(1,4)}-${d.slice(4,7)}-${d.slice(7)}`;
    return String(p || "").trim();
  }
  // NPI check digit: Luhn with 80840 prefix
  function npiValid(n){
    if (!/^\d{10}$/.test(n)) return false;
    const s = "80840" + n.slice(0,9);
    let sum = 0;
    for (let i = 0; i < s.length; i++){
      let d = +s[s.length - 1 - i];
      if (i % 2 === 0){ d *= 2; if (d > 9) d -= 9; }
      sum += d;
    }
    return (10 - (sum % 10)) % 10 === +n[9];
  }

  function toast(msg){
    const t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1800);
  }
  async function copyText(t){
    try { await navigator.clipboard.writeText(t); return true; } catch {}
    try {
      const ta = document.createElement("textarea"); ta.value = t; ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;top:-1000px;opacity:0"; document.body.appendChild(ta);
      ta.select(); const ok = document.execCommand("copy"); ta.remove(); return ok;
    } catch { return false; }
  }
  function copiedBubble(el, msg){
    document.querySelectorAll(".bubble").forEach(b => b.remove());
    const r = el.getBoundingClientRect();
    const b = document.createElement("div");
    b.className = "bubble"; b.textContent = msg;
    document.body.appendChild(b);
    const z = parseFloat(document.documentElement.style.zoom) || 1;
    // with page zoom, rects come back in zoomed pixels while left/top are unzoomed
    const bw = b.getBoundingClientRect().width / z, bh = b.getBoundingClientRect().height / z;
    b.style.left = ((r.left + Math.min(r.width, 120 * z) / 2) / z + window.scrollX / z - bw / 2) + "px";
    b.style.top = (r.top / z + window.scrollY / z - bh - 6) + "px";
    requestAnimationFrame(() => b.classList.add("show"));
    setTimeout(() => { b.classList.remove("show"); setTimeout(() => b.remove(), 200); }, 1100);
  }
  function banner(msg){ const b = $("banner"); b.textContent = msg || ""; b.style.display = msg ? "block" : "none"; }

  function uniqSorted(arr){
    const m = new Map();
    arr.forEach(v => { const k = norm(v); if (k && !m.has(k)) m.set(k, v.trim()); });
    return [...m.values()].sort((a,b) => a.localeCompare(b));
  }

  function refreshFilters(){
    const specs = uniqSorted(providers.flatMap(specsOf));
    const cities = uniqSorted(providers.flatMap(citiesOf));
    const fill = (sel, items, label) => {
      const cur = sel.value;
      sel.innerHTML = `<option value="">${label}</option>` + items.map(v => `<option>${esc(v)}</option>`).join("");
      if (items.some(v => v === cur)) sel.value = cur;
    };
    fill($("fSpec"), specs, "All specialties");
    fill($("fCity"), cities, "All cities");
    $("specList").innerHTML = specs.map(v => `<option value="${esc(v)}">`).join("");
  }

  function render(){
    const q = norm($("q").value).trim();
    const qd = digits(q);
    const fs = norm($("fSpec").value);
    const fi = "";
    const fc = norm($("fCity").value);
    const fst = $("fStatus").value;
    const list = providers.filter(p => {
      if (fs && !specsOf(p).some(x => norm(x) === fs)) return false;
      if (fc && !citiesOf(p).some(c => norm(c) === fc)) return false;
      if (fst && (p.status || "") !== fst) return false;
      if (!q) return true;
      const locs = p.locations || [];
      const hay = norm([p.name, ...specsOf(p), p.address, p.npi, p.notes, ...(p.accepted||[]), ...(p.notAccepted||[]), ...locs.flatMap(l => [l.name, l.address]), ...(p.services||[])].join(" "));
      if (hay.includes(q)) return true;
      return qd.length >= 3 && [p.phone, p.fax, p.npi, ...locs.flatMap(l => [l.phone, l.fax])].some(x => digits(x).includes(qd));
    }).sort((a,b) => (specsOf(a)[0]||"").localeCompare(specsOf(b)[0]||"") || (a.name||"").localeCompare(b.name||""));

    const grid = $("grid"), empty = $("empty");
    if (!loaded){ grid.innerHTML = ""; empty.hidden = false; empty.innerHTML = "<p>Loading providers…</p>"; $("count").textContent = ""; return; }
    $("count").textContent = providers.length ? `${list.length} of ${providers.length} provider${providers.length===1?"":"s"}` : "";
    if (!providers.length){
      grid.innerHTML = ""; empty.hidden = false;
      empty.innerHTML = `<h2>No providers yet</h2><p>${canWrite ? "Click <b>+ Add provider</b> to create the first card." : "Providers will appear here once they’re added."}</p>`;
      return;
    }
    if (!list.length){ grid.innerHTML = ""; empty.hidden = false; empty.innerHTML = "<h2>No matches</h2><p>Try a different search or clear the filters.</p>"; return; }
    empty.hidden = true;

    grid.innerHTML = list.map(p => {
      const chip = (arr, cls) => arr && arr.length
        ? `<div class="chips">${arr.map(i => `<span class="chip ${cls}${cls==="ok" && fi && norm(i)===fi ? " hit":""}">${esc(i)}</span>`).join("")}</div>`
        : `<span class="none">Not listed</span>`;
      const ICON = {
        Phone: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>',
        Fax: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>',
        Address: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>'
      };
      const lbl = label => ICON[label] ? `<dt class="ic" title="${label}"><span class="sr">${label}</span>${ICON[label]}</dt>` : `<dt>${label}</dt>`;
      const val2 = (label, val) => val ? `<span class="cp" data-copy="${esc(val)}" title="Click to copy ${label.toLowerCase()}">${esc(val)}</span>` : '<span class="none">—</span>';
      const row = (label, val) => `${lbl(label)}<dd>${val2(label, val)}</dd>`;
      const updated = p.updatedAt ? new Date(p.updatedAt).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}) : "";
      const addr1 = (p.address || "").split(/\n+/).map(x => x.trim()).filter(Boolean).join(", ");
      const item = (label, val, icon) => val
        ? `<span class="it">${icon}<span class="cp" data-copy="${esc(val)}" title="Click to copy ${label.toLowerCase()}">${esc(val)}</span></span>`
        : `<span class="it">${icon}<span class="none">—</span></span>`;
      const ICO = l => `<span class="ico" title="${l}">${ICON[l]}</span>`;
      const extraLocs = p => {
        const locs = (p.locations || []).filter(l => l.address || l.phone || l.fax || l.name);
        if (!locs.length) return "";
        const open = expanded.has(p.id);
        const n = locs.length;
        return `<div class="more-locs">
          <button type="button" class="loc-toggle" data-locs="${esc(p.id)}" aria-expanded="${open}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>${open ? "Hide" : "+" + n} additional location${n === 1 ? "" : "s"}
          </button>
          ${open ? `<div class="loc-list">${locs.map(l => {
            const a = (l.address || "").split(/\n+/).map(x => x.trim()).filter(Boolean).join(", ");
            return `<div class="loc">
              ${l.name ? `<div class="loc-name">${esc(l.name)}</div>` : ""}
              <div class="r2"><span class="it it-addr">${ICO("Address")}${addrHTML(l.address)}</span></div>
              <div class="r2">${item("Phone", fmtPhone(l.phone), ICO("Phone"))}${item("Fax", fmtPhone(l.fax), ICO("Fax"))}</div>
            </div>`;}).join("")}</div>` : ""}
        </div>`;
      };
      const ini = initials(p.name);
      const stLbl = { open: "Open", limited: "Limited", closed: "Closed" }[p.status] || "Status not set";
      const nAcc = (p.accepted || []).length, nNo = (p.notAccepted || []).length, nSvc = (p.services || []).length;
      const val = (label, v) => v ? `<span class="cp" data-copy="${esc(v)}" title="Click to copy ${label.toLowerCase()}">${esc(v)}</span>` : '<span class="none">—</span>';
      return `<article class="card ecard st-${p.status || "none"}">
        <div class="rail" title="${esc(STATUS[p.status] || "New-patient status not set")}">
          <div class="av"><span class="ms">${esc(iconFor(p))}</span><span class="ini">${esc(ini)}</span></div>
          <small>${stLbl}</small>
          ${p.updatedAt ? `<span class="rail-upd" title="Last updated ${esc(updated)}">Updated<br>${esc(new Date(p.updatedAt).toLocaleDateString("en-US",{month:"numeric",day:"numeric",year:"2-digit"}))}</span>` : ""}
        </div>
        <div class="mid">
          <div class="etop">
            <h3 class="name"><span class="cp" data-copy="${esc(p.name)}" title="Click to copy provider name">${esc(p.name)}</span></h3>
            <div class="specs">${specsOf(p).map(x => `<span class="spec">${esc(x)}</span>`).join("")}</div>
          </div>
          <div class="egrid">
            <span class="k ki ki-top" title="Address">${ICON.Address}</span><span class="span3">${addrHTML(p.address)}</span>
            <span class="k ki" title="Phone">${ICON.Phone}</span><span>${val("Phone", fmtPhone(p.phone))}</span>
            <span class="k ki k2" title="Fax">${ICON.Fax}</span><span>${val("Fax", fmtPhone(p.fax))}</span>
            <span class="k">NPI</span><span class="span3">${val("NPI", p.npi)}</span>
          </div>
          ${extraLocs(p)}
          ${p.notes ? `<div class="notes">${esc(p.notes)}</div>` : ""}
        </div>
        <div class="tools">
          <div class="ins-pop">
            <button type="button" class="ins-pill tbtn" aria-haspopup="true" aria-label="Insurance: ${nAcc} accepted, ${nNo} not accepted"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span class="badge ok">${nAcc}</span>${nNo ? `<span class="badge no">${nNo}</span>` : ""}</button>
            <div class="pop" role="tooltip">
              <div class="insrow"><span class="ins-l ok">Accepts</span>${chip(p.accepted, "ok")}</div>
              <div class="insrow"><span class="ins-l no">Doesn’t accept</span>${chip(p.notAccepted, "no")}</div>
            </div>
          </div>
          ${nSvc ? `<div class="ins-pop">
            <button type="button" class="ins-pill tbtn" aria-haspopup="true" aria-label="Services: ${nSvc}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg><span class="badge svc">${nSvc}</span></button>
            <div class="pop" role="tooltip"><div class="insrow"><span class="ins-l svc">Services offered</span>${chip(p.services, "svc")}</div></div>
          </div>` : ""}
          ${canWrite ? `<button class="tbtn" data-edit="${esc(p.id)}" title="Edit provider" aria-label="Edit provider"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>` : ""}
          <button class="tbtn" data-blurb="${esc(p.id)}" title="Copy referral note" aria-label="Copy referral note"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg></button>
        </div>
      </article>`;
    }).join("");
  }

  const expanded = new Set();   // providers whose extra locations are shown
  const STATUS = { open: "Open to new patients", limited: "Limited new patients", closed: "Closed to new patients" };

  // ----- theme -----
  const SUN = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const MOON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  function paintThemeBtn(){
    const dark = document.documentElement.getAttribute("data-theme") === "dark";
    $("themeBtn").innerHTML = dark ? SUN + "Light mode" : MOON + "Dark mode";
  }
  $("themeBtn").addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("providerDirectory.theme", next); } catch {}
    paintThemeBtn();
  });
  paintThemeBtn();

  // ----- insurance popover -----
  function placePop(w){
    const r = w.getBoundingClientRect();
    w.classList.toggle("up", window.innerHeight - r.bottom < 200 && r.top > 220);
  }
  $("grid").addEventListener("mouseover", e => { const w = e.target.closest(".ins-pop"); if (w && !w.contains(e.relatedTarget)) placePop(w); });
  document.addEventListener("click", e => { if (!e.target.closest(".ins-pop")) document.querySelectorAll(".ins-pop.open").forEach(x => x.classList.remove("open")); });

  function initials(name){
    const stop = new Set(["of","and","the","&","at","for","in","md","do","dds","inc","llc","pc"]);
    const w = String(name || "").replace(/[^\p{L}\p{N}\s&]/gu, " ").split(/\s+/).filter(x => x && !stop.has(x.toLowerCase()));
    return ((w[0] || "?")[0] + (w[1] ? w[1][0] : (w[0] || "").slice(1, 2))).toUpperCase();
  }

  // ----- provider icons (Google Material Symbols) -----
  const ICONS = [
    ["cardiology","Cardiology heart"],["ecg_heart","Heart ECG"],["monitor_heart","Heart monitor"],["favorite","Heart"],["ecg","ECG"],["blood_pressure","Blood pressure"],
    ["neurology","Neurology brain"],["psychology","Psychology mind head"],["psychiatry","Psychiatry mental health"],["cognition","Cognition brain"],["self_improvement","Behavioral health wellness"],
    ["pulmonology","Pulmonology lungs"],["respiratory_rate","Respiratory breathing"],["oxygen_saturation","Oxygen saturation"],["airwave","Airway breath"],
    ["gastroenterology","Gastroenterology stomach GI"],["nephrology","Nephrology kidney"],["urology","Urology bladder"],["endocrinology","Endocrinology thyroid gland"],["glucose","Glucose diabetes"],
    ["hematology","Hematology blood"],["bloodtype","Blood type"],["water_drop","Drop fluid"],["oncology","Oncology cancer"],["immunology","Immunology immune"],["allergy","Allergy"],["allergies","Allergies"],
    ["rheumatology","Rheumatology joints"],["orthopedics","Orthopedics bone"],["skeleton","Skeleton bones"],["foot_bones","Foot podiatry"],["hand_bones","Hand"],["femur","Femur leg bone"],["tibia","Tibia shin bone"],["humerus","Humerus arm bone"],["ulna_radius","Forearm wrist"],
    ["physical_therapy","Physical therapy rehab"],["accessible","Wheelchair accessible"],["assist_walker","Walker mobility"],["falling","Fall risk"],["personal_injury","Injury trauma"],
    ["dermatology","Dermatology skin"],["ophthalmology","Ophthalmology eye"],["visibility","Eye vision"],["eyeglasses","Optometry glasses"],["ent","ENT ear nose throat"],["hearing","Hearing audiology"],["ear_sound","Ear audiology"],["sign_language","Sign language"],
    ["dentistry","Dentistry tooth dental"],["gynecology","Gynecology women OB"],["pregnant_woman","Pregnancy obstetrics"],["breastfeeding","Lactation breastfeeding"],["pediatrics","Pediatrics child"],["child_care","Child care"],["elderly","Geriatrics elderly"],["elderly_woman","Geriatrics elderly woman"],
    ["radiology","Radiology imaging x-ray"],["labs","Lab test tubes"],["lab_profile","Lab results"],["lab_panel","Lab panel"],["biotech","Pathology microscope"],["science","Science lab"],["genetics","Genetics DNA"],["coronavirus","Infectious disease virus"],

    if (show){
      const n = countChanges();
      $("pubText").innerHTML = `<b>${n} unpublished change${n === 1 ? "" : "s"}</b> — only you can see ${n === 1 ? "it" : "them"}. To publish, download <b>providers.json</b> and upload it to your GitHub project.`;
      $("pubDiscard").textContent = "Discard changes"; delete $("pubDiscard").dataset.armed;
    }
  }
  function applyMode(){
    // published site + editing off = read-only view
    canWrite = published === null ? true : editMode;
    const ro = !canWrite;
    $("addBtn").hidden = ro;
    $("exportBtn").hidden = ro; $("importBtn").hidden = ro;
    if ($("editToggle")) $("editToggle").checked = editMode;
    if ($("editRow")) $("editRow").hidden = published === null;
    paintPublishBar();
    render();
  }
  function persist(){
    if (published !== null && !editMode) return true; // read-only view never saves
    paintPublishBar();
    try { localStorage.setItem(KEY, JSON.stringify(providers)); return true; }
    catch { storageOk = false; banner("This browser isn’t letting the page save. Use Export to keep a backup of your changes."); return false; }
  }
  function load(){
    try { const raw = localStorage.getItem(KEY); providers = raw ? JSON.parse(raw) : []; if (!Array.isArray(providers)) providers = []; }
    catch { providers = []; storageOk = false; banner("This browser isn’t letting the page save. Use Export to keep a backup of your changes."); }
  }
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  col = {
    add: async d => { providers.push({ id: newId(), ...d }); persist(); refreshFilters(); render(); },
    doc: id => ({
      set: async d => { const i = providers.findIndex(p => p.id === id); if (i > -1) providers[i] = { id, ...d }; persist(); refreshFilters(); render(); },
      delete: async () => { providers = providers.filter(p => p.id !== id); persist(); refreshFilters(); render(); }
    })
  };

  // Export / import
  $("exportBtn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify({ app: "specialty-provider-directory", exportedAt: new Date().toISOString(), providers }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "providers.json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast("providers.json downloaded");
  });
  $("pubDownload").addEventListener("click", () => $("exportBtn").click());
  $("pubDiscard").addEventListener("click", e => {
    const b = e.currentTarget;
    if (!b.dataset.armed){ b.dataset.armed = "1"; b.textContent = "Click again to discard"; setTimeout(() => { if (b.dataset.armed){ delete b.dataset.armed; b.textContent = "Discard changes"; } }, 4000); return; }
    providers = published.map(p => ({ ...p }));
    try { localStorage.removeItem(KEY); } catch {}
    refreshFilters(); applyMode(); toast("Changes discarded");
  });
  $("editToggle").addEventListener("change", e => {
    editMode = e.target.checked;
    try { localStorage.setItem(EDIT_KEY, editMode ? "1" : "0"); } catch {}
    if (!editMode && published !== null) providers = published.map(p => ({ ...p })); // view mode shows the published list
    else if (editMode) loadDraftOrPublished();
    refreshFilters(); applyMode();
  });
  $("importBtn").addEventListener("click", () => $("importFile").click());
  $("importFile").addEventListener("change", async e => {
    const f = e.target.files[0]; e.target.value = "";
    if (!f) return;
    try {
      const parsed = JSON.parse(await f.text());
      const list = Array.isArray(parsed) ? parsed : parsed.providers;
      if (!Array.isArray(list)) throw 0;
      const clean = sanitizeList(list);
      // merge: imported entries replace ones with the same id, others are added
      const byId = new Map(providers.map(p => [p.id, p]));
      clean.forEach(p => byId.set(p.id, p));
      providers = [...byId.values()];
      persist(); refreshFilters(); render();
      toast(`Imported ${clean.length} provider${clean.length===1?"":"s"}`);
    } catch { toast("That file isn’t a provider directory backup"); }
  });

  function loadDraftOrPublished(){
    let draft = null;
    try { const raw = localStorage.getItem(KEY); draft = raw ? JSON.parse(raw) : null; } catch {}
    if (Array.isArray(draft) && draft.length && canonical(draft) !== canonical(published)) providers = draft;
    else { providers = published.map(p => ({ ...p })); try { localStorage.removeItem(KEY); } catch {} }
  }
  async function start(){
    try {
      if (location.protocol === "file:") throw 0;  // opened from a folder: no website to load from
      const res = await fetch("providers.json", { cache: "no-store" });
      if (!res.ok) throw 0;
      const parsed = await res.json();
      published = sanitizeList(Array.isArray(parsed) ? parsed : parsed.providers);
    } catch { published = null; }
    if (published === null) load();              // local file: same as before
    else if (editMode) loadDraftOrPublished();
    else providers = published.map(p => ({ ...p }));
    loaded = true; refreshFilters(); applyMode();
  }
  render();
  start();
  initIconFont();
})();
</script>
</body>
</html>
